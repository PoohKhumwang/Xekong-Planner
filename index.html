<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timeline Planner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css?family=Montserrat:400,700" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main>
    <div class="calendar__banner--month">
      <h1 class="banner-title">XEKONG PLANNER</h1>
      <div class="banner-nav">
        <button class="nav-btn" id="prevBtn" aria-label="Previous page">‹</button>
        <span id="pageIndicator" class="page-indicator">1 / 3</span>
        <button class="nav-btn" id="nextBtn" aria-label="Next page">›</button>
      </div>
    </div>
    <div class="table-wrap">
      <table class="calendar">
        <tbody id="calendarBody"></tbody>
      </table>
    </div>
    <div class="footer">
      <div class="legend">
        <span class="swatch training" style="margin-left:.75rem;"></span> Training
        <span class="swatch testing" style="margin-left:.75rem;"></span> Done
      </div>
      <div class="status" id="counter"></div>
      <span id="sync-badge" class="sync-badge offline">○ OFFLINE</span>

    </div>
  </main>

  <script src="script.js"></script>
</body>

</html>
